# Same training budget and temporal encoder for every Phase 3 head.
epochs: 40
batch_size: 8
learning_rate: 0.001
weight_decay: 0.001
gradient_clip: 5.0
seed: 42
num_workers: 0
model:
  input_dim: 1024
  width: 512
  hidden_size: 256
  layers: 2
  dropout: 0.1
head:
  kind: b_shuf
  embeddings: data/text/embeddings/fasttext/reference/embeddings.pt
  temperature: 0.07
  learn_temperature: true
  control_seed: 42
